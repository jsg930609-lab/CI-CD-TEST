name: Selenium Tests CI/CD

# 트리거 조건
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 매일 오전 9시(UTC)에 자동 실행 (한국시간 오후 6시)
    - cron: '1 0 * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
        browser: ['chrome']
    
    steps:
    # 1. 코드 체크아웃
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    # 2. Python 설정
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    # 3. 의존성 설치
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # 4. Chrome 브라우저 설치
    - name: 🌐 Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    # 5. Chrome 버전 확인
    - name: ℹ️ Check Chrome version
      run: |
        google-chrome --version
    
    # 6. 테스트 실행 (스모크 테스트)
    - name: 🧪 Run Smoke Tests
      run: |
        pytest tests/ -m smoke -v --html=reports/smoke_report.html --self-contained-html
      continue-on-error: true
    
    # 7. 테스트 실행 (전체 테스트)
    - name: 🧪 Run All Tests
      run: |
        pytest tests/ -v --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
      continue-on-error: true
    
    # 8. 테스트 결과 업로드
    - name: 📊 Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: |
          reports/
          logs/
    
    # 9. 스크린샷 업로드 (실패한 경우)
    - name: 📸 Upload Screenshots
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: screenshots-python-${{ matrix.python-version }}
        path: reports/screenshots/
    
    # 10. 테스트 결과 요약
    - name: 📋 Test Summary
      if: always()
      run: |
        echo "## Test Results 🧪" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Python Version: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- Browser: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f reports/junit.xml ]; then
          echo "Test report generated successfully ✅" >> $GITHUB_STEP_SUMMARY
        else
          echo "Test report not found ❌" >> $GITHUB_STEP_SUMMARY
        fi

  # Slack 알림 (선택사항)
  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 💬 Send notification
      run: |
        echo "Tests completed. Check the results in the Actions tab."